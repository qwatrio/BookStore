<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Вход — Философский камень</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header class="header">
    <div class="container header__inner">

        <a href="index.html" class="logo">
            Философский камень
        </a>

        <nav class="nav">
            <a href="index.html">Каталог</a>
        </nav>

    </div>
</header>


<main>

    <section class="auth">
        <div class="container">

            <div class="auth__card">

                <h1 class="auth__title">
                    Вход
                </h1>


                <form id="login-form">

                    <div class="form-group">

                        <label for="email">
                            Email
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Введите email"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="password">
                            Пароль
                        </label>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Введите пароль"
                            required
                        >

                    </div>


                    <button
                        type="submit"
                        class="auth__button"
                    >
                        Войти
                    </button>

                </form>


                <p id="login-message"></p>

            </div>

        </div>
    </section>

</main>


<script src="js/login.js"></script>

</body>
</html>
